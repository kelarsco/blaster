# fly.io — multi-process: api (HTTP) + scan worker + lead worker
# Docs: docs/FLY_WORKERS.md

app = 'wiblaster'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  HOST = '0.0.0.0'
  FRONTEND_URL = 'https://wiblaster.com'
  # PROCESS_ROLE is set by each entrypoint (index.js=api, scan-worker.js=scan, lead-worker.js=lead)
  # Scan / lead tuning (also set on worker machines via secrets if needed)
  SCAN_CONCURRENCY = '1'
  CRAWL_MAX_IN_FLIGHT = '3'
  DB_POOL_MAX = '6'
  DB_AUTH_POOL_MAX = '2'

[processes]
  api = "node index.js"
  scan = "node scan-worker.js"
  lead = "node lead-worker.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['api']

# Machine 1 — API / auth (always on, lightweight)
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['api']

# Machine 2 — scan workers (scale horizontally: fly scale count scan=2)
[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  processes = ['scan']

# Machine 3 — lead engine + campaign sends + scrape scheduler
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['lead']
